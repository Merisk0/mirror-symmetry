name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Self test
        run: python mirror_symmetry.py --selftest

  exe:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[build]
      - name: Build exe
        run: python scripts/build_exe.py
      - name: Verify exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MirrorSymmetry.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          Get-Content selftest_report.txt
          if ($p.ExitCode -ne 0) { throw "exe selftest failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorSymmetry-exe
          path: dist/MirrorSymmetry.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MirrorSymmetry.exe
          generate_release_notes: true

