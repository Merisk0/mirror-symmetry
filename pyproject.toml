[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-symmetry"
version = "2.2.0"
description = "对称表情包生成器 —— 把图片 / GIF 从中间镜像成对称图"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "merisk" }]
keywords = ["image", "gif", "mirror", "symmetric", "meme", "tkinter"]
dependencies = ["Pillow>=9.1.0"]

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.3.0"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=7.0"]

[project.gui-scripts]
mirror-symmetry = "mirror_symmetry.ui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]


